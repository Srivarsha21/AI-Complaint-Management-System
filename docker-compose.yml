services:
  db:
    image: postgres:16-alpine
    container_name: complaints-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-complaints}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-complaints_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-complaints}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-complaints} -d ${POSTGRES_DB:-complaints}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
